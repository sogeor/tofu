name: deploy
on:
  push:
    branches: [master]
    paths: ["servers/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  servers:
    uses: sogeor/workflows/.github/workflows/tofu-deploy.yml@v1
    with:
      working-directory: servers
    secrets: inherit

  ansible:
    needs: servers
    if: needs.servers.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sogeor
          repositories: ansible
      - name: Trigger sogeor/ansible deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          gh api -X POST repos/sogeor/ansible/dispatches
          -f event_type=tofu-applied
          -f "client_payload[sha]=$GITHUB_SHA"
