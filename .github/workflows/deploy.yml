name: deploy
on:
  push:
    branches: [master]
    paths: ["dns/**", "servers/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  servers:
    uses: sogeor/workflows/.github/workflows/tofu-deploy.yml@e1e3a59337789cb469c440b4a68f6785338aac66 # v1.2.0
    with:
      working-directory: servers
    secrets: inherit

  # Reads the servers state, so it runs after servers is applied.
  dns:
    needs: servers
    uses: sogeor/workflows/.github/workflows/tofu-deploy.yml@e1e3a59337789cb469c440b4a68f6785338aac66 # v1.2.0
    with:
      working-directory: dns
    secrets: inherit

  ansible:
    needs: servers
    if: needs.servers.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sogeor
          repositories: ansible
      - name: Trigger sogeor/ansible deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          gh api -X POST repos/sogeor/ansible/dispatches
          -f event_type=tofu-applied
          -f "client_payload[sha]=$GITHUB_SHA"
