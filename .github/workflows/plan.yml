name: plan
on:
  pull_request:
    paths: ["servers/**", ".github/workflows/plan.yml"]
permissions: { contents: read }
concurrency: { group: "plan-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  servers:
    uses: sogeor/workflows/.github/workflows/tofu-plan-pr.yml@c1895bcf1f56e3c884be3d7eae763475c44d614d # v1.1.4
    with:
      working-directory: servers
    permissions: { contents: read, pull-requests: write }
    secrets: inherit
