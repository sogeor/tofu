name: plan
on:
  pull_request:
    paths: ["dns/**", "servers/**", ".github/workflows/plan.yml"]
permissions: { contents: read }
concurrency: { group: "plan-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  servers:
    uses: sogeor/workflows/.github/workflows/tofu-plan-pr.yml@e1e3a59337789cb469c440b4a68f6785338aac66 # v1.2.0
    with:
      working-directory: servers
    permissions: { contents: read, pull-requests: write }
    secrets: inherit

  # Plans against the applied servers state, not the servers changes of this pull request.
  dns:
    uses: sogeor/workflows/.github/workflows/tofu-plan-pr.yml@e1e3a59337789cb469c440b4a68f6785338aac66 # v1.2.0
    with:
      working-directory: dns
    permissions: { contents: read, pull-requests: write }
    secrets: inherit
